name: Payment regression smoke test

on:
  # This smoke test creates persistent invoices, payments, supplier bills and POS records.
  # Run manually only when its data impact and cleanup plan have been reviewed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-regression-development
  cancel-in-progress: false

jobs:
  payment-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required test credentials are configured
        env:
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: |
          missing=0
          for name in OMEGA_SECURITY_TEST_A_EMAIL OMEGA_SECURITY_TEST_A_PASSWORD OMEGA_SECURITY_TEST_B_EMAIL OMEGA_SECURITY_TEST_B_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured."
              missing=1
            fi
          done
          exit "$missing"
      - name: Validate explicit development API target
        env:
          # Prefer configured GitHub Actions values; use the verified Render development service if none is configured.
          OMEGA_API_URL: ${{ vars.OMEGA_DEVELOPMENT_API_URL || secrets.OMEGA_DEVELOPMENT_API_URL || 'https://omega-solutions-api-development.onrender.com/api' }}
        run: |
          node --input-type=module -e 'const value=process.env.OMEGA_API_URL; if (!value) throw new Error("No development API URL is configured; refusing to run."); const url=new URL(value); if (url.hostname === "omega-solutions-api.onrender.com") throw new Error("Production API URL is forbidden in development smoke tests."); if (url.hostname !== "omega-solutions-api-development.onrender.com" && url.hostname !== "omega-solutions-api-preview.onrender.com" && !url.pathname.endsWith("/api")) throw new Error("Unexpected development API target."); if (!url.pathname.endsWith("/api") && !url.pathname.endsWith("/api/")) throw new Error("Development API URL must end in /api."); console.log("Development API target configured:", url.origin + url.pathname);'

      - name: Run authenticated payment regression against development API
        env:
          OMEGA_API_URL: ${{ vars.OMEGA_DEVELOPMENT_API_URL || secrets.OMEGA_DEVELOPMENT_API_URL || 'https://omega-solutions-api-development.onrender.com/api' }}
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-payment-regression-smoke.mjs
