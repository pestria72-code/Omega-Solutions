name: Manufacturing live valuation smoke test

# This smoke test creates purchasing, inventory, and accounting records.
# Keep it manual-only until its fixture cleanup is implemented.
on:
  workflow_dispatch:

concurrency:
  group: omega-development-manufacturing-live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manufacturing-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout existing development branch
        uses: actions/checkout@v4
        with:
          ref: development
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify authenticated manufacturing valuation and accounting
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-manufacturing-smoke.mjs
