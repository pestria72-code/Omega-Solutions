name: Development tenant security smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout existing development branch
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify development API and cross-tenant auth isolation
        env:
          OMEGA_API_URL: https://omega-solutions-api.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-auth-tenant-security-smoke.mjs
