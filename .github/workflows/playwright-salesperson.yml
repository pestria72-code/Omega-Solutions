name: Salesperson Playwright E2E
run-name: Salesperson E2E on ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - "vite-version/**"
      - ".github/workflows/playwright-salesperson.yml"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vite-version
    env:
      CI: "true"
      E2E_SALESPERSON_EMAIL: ${{ secrets.E2E_SALESPERSON_EMAIL }}
      E2E_SALESPERSON_PASSWORD: ${{ secrets.E2E_SALESPERSON_PASSWORD }}
      E2E_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
      VITE_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}
      E2E_NEON_AUTH_URL: ${{ vars.E2E_NEON_AUTH_URL || 'https://ep-fragrant-bird-b4hie5sp.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth' }}
      VITE_NEON_AUTH_URL: ${{ vars.E2E_NEON_AUTH_URL || 'https://ep-fragrant-bird-b4hie5sp.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth' }}
      E2E_CHECKOUT_PRODUCT: ${{ vars.E2E_CHECKOUT_PRODUCT }}
      E2E_ALLOW_MUTATIONS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vite-version/package-lock.json
      - name: Validate E2E API target and mutation safety
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${E2E_API_BASE_URL}" ]]; then
            echo "::error::E2E_API_BASE_URL secret is required."
            exit 1
          fi
          if [[ "${E2E_API_BASE_URL}" != */api ]]; then
            echo "::error::E2E_API_BASE_URL must end in /api."
            exit 1
          fi
          if [[ "${E2E_API_BASE_URL}" != https://* ]]; then
            echo "::error::E2E_API_BASE_URL must use HTTPS."
            exit 1
          fi
          if [[ "${E2E_API_BASE_URL,,}" == *"omega-solutions-api.onrender.com"* && "${E2E_ALLOW_MUTATIONS}" != "false" ]]; then
            echo "::error::Refusing to run mutating E2E tests against the live Omega API."
            exit 1
          fi
          if [[ "${E2E_ALLOW_MUTATIONS}" != "false" ]]; then
            echo "::error::Salesperson E2E checkout mutations must remain disabled until a verified development API is configured."
            exit 1
          fi
          echo "API URL format validated; checkout mutations are disabled."
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesperson-playwright-results
          path: |
            vite-version/test-results/
            vite-version/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
