name: Omega Solutions CI

on:
  pull_request:
    paths:
      - "api/**"
      - "vite-version/**"
      - "render.yaml"
      - ".github/workflows/omega-ci.yml"
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "vite-version/**"
      - "render.yaml"
      - ".github/workflows/omega-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend build, lint, and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  frontend:
    name: Frontend type-check and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-version
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vite-version/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api
