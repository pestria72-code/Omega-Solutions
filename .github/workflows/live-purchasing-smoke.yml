name: Authenticated purchasing live smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - "api/scripts/neon-test-auth.mjs"
      - "api/scripts/live-purchasing-smoke.mjs"
      - "api/scripts/live-payment-regression-smoke.mjs"
      - "api/scripts/live-hrm-expenses-smoke.mjs"
      - "api/scripts/live-payroll-smoke.mjs"
      - "api/scripts/cleanup-live-smoke-tenants.mjs"
      - "api/src/pos/**"
      - "api/src/invoices/**"
      - "api/src/supplier-bills/**"
      - "api/src/accounting/**"
      - "api/src/purchase-orders/**"
      - "api/src/inventory/**"
      - "api/src/products/**"
      - "api/src/customers/**"
      - "api/src/suppliers/**"
      - "api/src/quotations/**"
      - "api/src/sales-orders/**"
      - "api/src/companies/**"
      - "api/src/memberships/**"
      - "api/src/employees/**"
      - "api/src/payroll/**"
      - "api/src/expenses/**"
      - "api/src/crm/**"
      - ".github/workflows/live-purchasing-smoke.yml"

concurrency:
  group: omega-development-live-smoke
  cancel-in-progress: true

permissions:
  contents: read

# Re-run after configuring the development-only cleanup secret; production is never targeted.
# Tests target the development API. Tenant cleanup requires an explicitly configured
# development-only database secret and strict tenant/email guards in the cleanup script.

jobs:
  live-purchasing-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Verify development-only API URL
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
        run: |
          node --input-type=module -e 'const value=process.env.OMEGA_API_URL; const url=new URL(value); if (url.hostname !== "omega-solutions-api-development.onrender.com" || url.pathname !== "/api") throw new Error("Refusing to run smoke tests against anything except the fixed development API."); console.log("Development API target configured:", url.origin + url.pathname);'

      - name: Set up Node.js for read-only approver diagnostic
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies for read-only approver diagnostic
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Classify configured approver against Fezaton membership without logging credentials
        env:
          OMEGA_DEVELOPMENT_DATABASE_URL: ${{ secrets.OMEGA_DEVELOPMENT_DATABASE_URL }}
          OMEGA_DEVELOPMENT_DATABASE_BRANCH: omega-migration-smoke-test-live
          OMEGA_SECURITY_TEST_APPROVER_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_APPROVER_EMAIL }}
        working-directory: api
        run: |
          node --input-type=module -e '
            import pg from "pg";
            const { Pool } = pg;
            const url = process.env.OMEGA_DEVELOPMENT_DATABASE_URL;
            const branch = process.env.OMEGA_DEVELOPMENT_DATABASE_BRANCH;
            const email = process.env.OMEGA_SECURITY_TEST_APPROVER_EMAIL?.trim().toLowerCase();
            if (!url || branch !== "omega-migration-smoke-test-live" || !email) {
              throw new Error("Approver diagnostic requires the approved development DB secret, exact branch guard, and configured approver email.");
            }
            const pool = new Pool({
              connectionString: url,
              ssl: /neon\.tech/i.test(url) ? { rejectUnauthorized: false } : undefined,
              max: 1,
              connectionTimeoutMillis: 10000,
            });
            try {
              const db = await pool.query("SELECT current_database() AS name");
              if (db.rows[0]?.name !== "neondb") throw new Error("Refusing diagnostic: expected the neondb database.");
              const result = await pool.query(`
                SELECT m.role
                FROM public.users u
                JOIN public.company_memberships m ON m.user_id = u.id
                JOIN public.companies c ON c.id = m.company_id
                WHERE lower(trim(u.email)) = $1
                  AND c.name = $2
                  AND u.is_active = true
                  AND m.is_active = true
                LIMIT 2
              `, [email, "Fezaton Enterprises"]);
              if (result.rows.length === 0) {
                console.log("APPROVER_IDENTITY_CLASSIFICATION=NO_ACTIVE_FEZATON_MEMBERSHIP");
              } else if (result.rows.length > 1) {
                console.log("APPROVER_IDENTITY_CLASSIFICATION=MULTIPLE_ACTIVE_FEZATON_MEMBERSHIPS");
              } else {
                const role = String(result.rows[0].role).toLowerCase();
                console.log("APPROVER_IDENTITY_CLASSIFICATION=" + (
                  role === "owner" ? "FEZATON_OWNER" :
                  role === "manager" ? "FEZATON_MANAGER" :
                  "FEZATON_MEMBER_ROLE_" + role.replace(/[^a-z0-9_-]/g, "_")
                ));
              }
              const identity = await pool.query(`
                SELECT
                  EXISTS (SELECT 1 FROM public.users WHERE lower(trim(email)) = $1) AS omega_user_exists,
                  EXISTS (SELECT 1 FROM public.users WHERE lower(trim(email)) = $1 AND is_active = true) AS omega_user_active,
                  EXISTS (SELECT 1 FROM neon_auth."user" WHERE lower(trim(email)) = $1) AS neon_user_exists,
                  EXISTS (SELECT 1 FROM neon_auth."user" WHERE lower(trim(email)) = $1 AND "emailVerified" = true) AS neon_email_verified
              `, [email]);
              const row = identity.rows[0];
              console.log("APPROVER_ACCOUNT_DIAGNOSTIC=" + JSON.stringify({
                omegaUserExists: row.omega_user_exists,
                omegaUserActive: row.omega_user_active,
                neonUserExists: row.neon_user_exists,
                neonEmailVerified: row.neon_email_verified
              }));
              try {
                const credentials = await pool.query(`
                  SELECT a."providerId" AS provider_id,
                         COUNT(*)::int AS account_count,
                         BOOL_OR(a.password IS NOT NULL AND length(a.password) > 0) AS has_password_credential
                  FROM neon_auth.account a
                  JOIN neon_auth."user" u ON u.id = a."userId"
                  WHERE lower(trim(u.email)) = $1
                  GROUP BY a."providerId"
                `, [email]);
                console.log("APPROVER_AUTH_METHODS=" + JSON.stringify(credentials.rows.map(account => ({
                  provider: String(account.provider_id).slice(0, 40),
                  accountCount: account.account_count,
                  hasPasswordCredential: account.has_password_credential === true
                }))));
              } catch (diagnosticError) {
                console.log("APPROVER_AUTH_METHODS_DIAGNOSTIC_UNAVAILABLE=" + String(diagnosticError?.code || "unknown"));
              }
            } finally {
              await pool.end();
            }
          '

      - name: Verify live authenticated purchasing and accounting workflow
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
          OMEGA_SECURITY_TEST_APPROVER_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_APPROVER_EMAIL }}
          OMEGA_SECURITY_TEST_APPROVER_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_APPROVER_PASSWORD }}
        run: node api/scripts/live-purchasing-smoke.mjs

      - name: Verify live payment, reconciliation, POS and tenant-isolation workflow
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-payment-regression-smoke.mjs

      - name: Verify live authenticated HRM, expenses, CRM and trial balance
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
        run: node api/scripts/live-hrm-expenses-smoke.mjs

      - name: Verify employee statutory privacy and draft payroll calculations
        env:
          OMEGA_API_URL: https://omega-solutions-api-development.onrender.com/api
          OMEGA_SECURITY_TEST_A_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_A_EMAIL }}
          OMEGA_SECURITY_TEST_A_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_A_PASSWORD }}
          OMEGA_SECURITY_TEST_B_EMAIL: ${{ secrets.OMEGA_SECURITY_TEST_B_EMAIL }}
          OMEGA_SECURITY_TEST_B_PASSWORD: ${{ secrets.OMEGA_SECURITY_TEST_B_PASSWORD }}
          OMEGA_PAYROLL_SMOKE_CONFIRM_DEVELOPMENT: YES
        run: node api/scripts/live-payroll-smoke.mjs

  cleanup-test-tenants:
    name: Clean up development smoke-test tenants
    needs: live-purchasing-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OMEGA_DEVELOPMENT_DATABASE_URL: ${{ secrets.OMEGA_DEVELOPMENT_DATABASE_URL }}
    steps:
      - name: Checkout development
        if: ${{ env.OMEGA_DEVELOPMENT_DATABASE_URL != '' }}
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Set up Node.js
        if: ${{ env.OMEGA_DEVELOPMENT_DATABASE_URL != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cleanup script dependency
        if: ${{ env.OMEGA_DEVELOPMENT_DATABASE_URL != '' }}
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Clean up automated test tenants on the approved Neon development branch
        if: ${{ env.OMEGA_DEVELOPMENT_DATABASE_URL != '' }}
        env:
          OMEGA_DEVELOPMENT_DATABASE_BRANCH: omega-migration-smoke-test-live
          OMEGA_CLEANUP_TEST_TENANTS_CONFIRM: YES
        run: node api/scripts/cleanup-live-smoke-tenants.mjs

      - name: Report cleanup not configured
        if: ${{ env.OMEGA_DEVELOPMENT_DATABASE_URL == '' }}
        run: echo "::warning::Automated tenant cleanup skipped. Configure the GitHub Actions secret OMEGA_DEVELOPMENT_DATABASE_URL with the connection string for the existing omega-migration-smoke-test-live branch."
