name: Validate Omega development

on:
  push:
    branches:
      - development
    paths:
      - "api/**"
      - "vite-version/**"
      - ".github/workflows/validate-development.yml"
  pull_request:
    paths:
      - "api/**"
      - "vite-version/**"
      - ".github/workflows/validate-development.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            vite-version/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci
      - name: Build API
        working-directory: api
        run: npm run build
      - name: Run API tests
        working-directory: api
        run: npm test
      - name: Smoke-test deployed API health and database
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 --retry 3 --retry-all-errors --retry-delay 3 \
            https://omega-solutions-api.onrender.com/api/health \
            --output /tmp/omega-api-health.json
          cat /tmp/omega-api-health.json
          node -e "const h=require('/tmp/omega-api-health.json'); if (h.status !== 'ok' || h.database !== 'connected') { console.error('API health check failed'); process.exit(1); }"

      - name: Install frontend dependencies
        working-directory: vite-version
        run: npm ci
      - name: Build frontend
        working-directory: vite-version
        run: npm run build
